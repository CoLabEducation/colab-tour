  componentDidMount() {
    this._fit = () => {
      const w = window.innerWidth || 1120, h = window.innerHeight || 500;
      const sc = Math.min(w / 1120, h / 500);
      this.setState({ fs: sc, fx: (w - 1120 * sc) / 2, fy: (h - 500 * sc) / 2 });

  componentWillUnmount() { clearInterval(this._iv); window.removeEventListener('resize', this._fit); if (this._io) this._io.disconnect(); }
